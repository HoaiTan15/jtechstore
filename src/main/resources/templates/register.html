<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-jtech">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">J-Tech Store</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Trang chủ</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/products">Sản phẩm</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/cart">Giỏ hàng</a>
                </li>

                <li class="nav-item dropdown"
                    th:if="${session.currentUser != null and session.currentUser.role == 'ADMIN'}">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        Quản lý
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/dashboard">Dashboard</a></li>
                        <li><a class="dropdown-item" href="/admin/categories">QL Danh mục</a></li>
                        <li><a class="dropdown-item" href="/admin/products">QL Sản phẩm</a></li>
                        <li><a class="dropdown-item" href="/admin/promotions">QL Khuyến mãi</a></li>
                        <li><a class="dropdown-item" href="/admin/orders">QL Đơn hàng</a></li>
                        <li><a class="dropdown-item" href="/admin/users">QL Khách hàng</a></li>
                    </ul>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item" th:if="${session.currentUser == null}">
                    <a class="nav-link" href="/login">Đăng nhập</a>
                </li>

                <li class="nav-item" th:if="${session.currentUser == null}">
                    <a class="nav-link" href="/register">Đăng ký</a>
                </li>

                <li class="nav-item" th:if="${session.currentUser != null}">
                    <span class="nav-link user-badge">
                        Xin chào,
                        <span th:text="${session.currentUser.fullName != null ? session.currentUser.fullName : session.currentUser.username}"></span>
                    </span>
                </li>

                <li class="nav-item" th:if="${session.currentUser != null}">
                    <a class="nav-link" href="/logout">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5" style="max-width: 550px;">
    <div class="card shadow-sm">
        <div class="card-header card-jtech-header">
            <h4 class="mb-0">Đăng ký tài khoản khách hàng</h4>
        </div>

        <div class="card-body">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <form method="post" action="/register" th:object="${user}">
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input class="form-control" th:field="*{username}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input class="form-control" type="password" th:field="*{password}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Họ tên</label>
                    <input class="form-control" th:field="*{fullName}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input class="form-control" th:field="*{phone}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" th:field="*{email}">
                </div>

                <button class="btn btn-jtech">Đăng ký</button>
                <a href="/login" class="btn btn-outline-jtech">Đăng nhập</a>
                <a href="/" class="btn btn-secondary">Trang chủ</a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
