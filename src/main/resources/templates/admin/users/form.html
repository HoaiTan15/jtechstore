<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa tài khoản khách hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-jtech">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">J-Tech Admin</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">Dashboard</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        Quản lý
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/categories">Danh mục</a></li>
                        <li><a class="dropdown-item" href="/admin/products">Sản phẩm</a></li>
                        <li><a class="dropdown-item" href="/admin/promotions">Khuyến mãi</a></li>
                        <li><a class="dropdown-item" href="/admin/orders">Đơn hàng</a></li>
                        <li><a class="dropdown-item" href="/admin/users">Khách hàng</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/">Về website</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <span class="nav-link user-badge">
                        Xin chào,
                        <span th:text="${session.currentUser != null ? session.currentUser.fullName : 'Admin'}"></span>
                    </span>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4" style="max-width: 700px;">
    <div class="card shadow-sm">
        <div class="card-header card-jtech-header">Sửa tài khoản khách hàng</div>
        <div class="card-body">
            <form th:action="@{/admin/users/save}" th:object="${user}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{username}">
                <input type="hidden" th:field="*{password}">

                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    <input class="form-control" th:value="${user.username}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Họ tên</label>
                    <input class="form-control" th:field="*{fullName}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input class="form-control" th:field="*{phone}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input class="form-control" th:field="*{email}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Vai trò</label>
                    <select class="form-select" th:field="*{role}">
                        <option value="USER">Khách hàng</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" th:field="*{enabled}">
                    <label class="form-check-label">Tài khoản đang hoạt động</label>
                </div>

                <button class="btn btn-jtech">Lưu</button>
                <a href="/admin/users" class="btn btn-secondary">Quay lại</a>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
