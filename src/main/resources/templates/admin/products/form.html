<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle != null ? pageTitle : 'Form sản phẩm'}">Form sản phẩm</title>

    <link rel="icon" type="image/png" href="/images/logos/favicon.png?v=5">
    <link rel="shortcut icon" href="/images/logos/favicon.png?v=5">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-jtech">
    <div class="container">
        <a class="navbar-brand brand-logo-link" href="/admin/dashboard">
            <span class="brand-logo-box">
                <img src="/images/logos/logochinh-removebg.png"
                     alt="J-Tech Store"
                     class="brand-logo-img">
            </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/admin/dashboard">Dashboard</a>
                </li>

                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown">
                        Quản lý
                    </a>

                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="/admin/categories">Danh mục</a></li>
                        <li><a class="dropdown-item active" href="/admin/products">Sản phẩm</a></li>
                        <li><a class="dropdown-item" href="/admin/products/inventory">Tồn kho</a></li>
                        <li><a class="dropdown-item" href="/admin/promotions">Khuyến mãi</a></li>
                        <li><a class="dropdown-item" href="/admin/orders">Đơn hàng</a></li>
                        <li><a class="dropdown-item" href="/admin/users">Khách hàng</a></li>
                        <li><a class="dropdown-item" href="/admin/reviews">Đánh giá</a></li>
                    </ul>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/">Về website</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <span class="nav-link user-badge">
                        Xin chào,
                        <span th:text="${session.currentUser != null ? session.currentUser.fullName : 'Admin'}"></span>
                    </span>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="card shadow-sm">
        <div class="card-header card-jtech-header">
            <span th:text="${pageTitle != null ? pageTitle : 'Thông tin sản phẩm'}">Thông tin sản phẩm</span>
        </div>

        <div class="card-body">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-danger" th:if="${uploadError}" th:text="${uploadError}"></div>

            <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{imageUrl}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                        <input class="form-control" th:field="*{name}" required>
                        <div class="text-danger" th:errors="*{name}"></div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Giá <span class="text-danger">*</span></label>
                        <input class="form-control" type="number" min="0" step="1000" th:field="*{price}" required>
                        <div class="text-danger" th:errors="*{price}"></div>
                    </div>

                    <div class="col-md-3 mb-3">
                        <label class="form-label">Số lượng tồn kho <span class="text-danger">*</span></label>
                        <input class="form-control" type="number" min="0" th:field="*{quantity}" required>
                        <div class="text-danger" th:errors="*{quantity}"></div>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Danh mục</label>
                        <select class="form-select" th:field="*{category}">
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Khuyến mãi</label>
                        <select class="form-select" th:field="*{promotion}">
                            <option value="">Không khuyến mãi</option>
                            <option th:each="pr : ${promotions}" th:value="${pr.id}" th:text="${pr.name}"></option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Thương hiệu</label>
                        <input class="form-control" th:field="*{brand}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">CPU</label>
                        <input class="form-control" th:field="*{cpu}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">RAM</label>
                        <input class="form-control" th:field="*{ram}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ổ cứng</label>
                        <input class="form-control" th:field="*{storage}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Màn hình</label>
                        <input class="form-control" th:field="*{screen}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Bảo hành</label>
                        <input class="form-control" th:field="*{warranty}">
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Ảnh sản phẩm</label>
                        <input class="form-control" type="file" name="imageFile" accept="image/*">

                        <div class="mt-2" th:if="${product.imageUrl != null and !product.imageUrl.isEmpty()}">
                            <img th:src="${product.imageUrl}"
                                 style="width: 120px; height: 90px; object-fit: contain; border: 1px solid #ddd; border-radius: 8px; background: white;"
                                 onerror="this.src='/images/products/no-image.jpg'">
                        </div>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label class="form-label">Đường dẫn ảnh hiện tại</label>
                        <input class="form-control" th:field="*{imageUrl}" readonly>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
                    </div>
                </div>

                <button class="btn btn-jtech">Lưu</button>
                <a href="/admin/products" class="btn btn-secondary">Quay lại</a>
                <a href="/admin/products/inventory" class="btn btn-outline-jtech">Xem tồn kho</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
