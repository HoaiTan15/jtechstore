<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lịch sử mua hàng</title>

    <link rel="icon" type="image/png" href="/images/logos/favicon.png?v=5">
    <link rel="shortcut icon" href="/images/logos/favicon.png?v=5">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-jtech">
    <div class="container">
        <a class="navbar-brand brand-logo-link" href="/">
            <span class="brand-logo-box">
                <img src="/images/logos/logochinh-removebg.png"
                     alt="J-Tech Store"
                     class="brand-logo-img">
            </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Trang chủ</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/products">Sản phẩm</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/cart">Giỏ hàng</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/tai-khoan">Tài khoản</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <span class="nav-link user-badge">
                        Xin chào,
                        <span th:text="${session.currentUser != null and session.currentUser.fullName != null ? session.currentUser.fullName : (session.currentUser != null ? session.currentUser.username : 'Khách hàng')}"></span>
                    </span>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/logout">Đăng xuất</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <h2>Lịch sử mua hàng</h2>

    <a href="/tai-khoan" class="btn btn-secondary mb-3">Quay lại tài khoản</a>

    <table class="table table-bordered table-hover bg-white shadow-sm align-middle">
        <thead>
        <tr>
            <th>Mã đơn</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Phương thức</th>
            <th>Trạng thái đơn</th>
            <th>Thanh toán</th>
            <th>Chi tiết</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></td>

            <td>
                <span th:if="${o.paymentMethod == 'BANK_TRANSFER'}">Chuyển khoản QR</span>
                <span th:if="${o.paymentMethod != 'BANK_TRANSFER'}">Tiền mặt</span>
            </td>

            <td>
                <span class="badge badge-jtech" th:text="${o.status}"></span>
            </td>

            <td>
                <span class="badge bg-success" th:if="${o.paymentStatus == 'Đã thanh toán'}">Đã thanh toán</span>
                <span class="badge bg-warning text-dark"
                      th:if="${o.paymentStatus != 'Đã thanh toán'}"
                      th:text="${o.paymentStatus}">
                </span>
            </td>

            <td>
                <a th:href="@{/tai-khoan/don-hang/{id}(id=${o.id})}" class="btn btn-outline-jtech btn-sm">Xem</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${orders == null or orders.isEmpty()}" class="alert alert-jtech">
        Bạn chưa có đơn hàng nào.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
