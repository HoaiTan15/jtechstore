<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-jtech">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">J-Tech Store</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">Trang chủ</a>
            <a class="nav-link" href="/products">Sản phẩm</a>
            <a class="nav-link" href="/tai-khoan">Tài khoản</a>
            <a class="nav-link" href="/logout">Đăng xuất</a>
        </div>
    </div>
</nav>

<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header card-jtech-header">Đổi mật khẩu</div>

        <div class="card-body">
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

            <form method="post" action="/tai-khoan/doi-mat-khau">
                <div class="mb-3">
                    <label class="form-label">Mật khẩu cũ</label>
                    <input class="form-control" type="password" name="oldPassword" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu mới</label>
                    <input class="form-control" type="password" name="newPassword" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nhập lại mật khẩu mới</label>
                    <input class="form-control" type="password" name="confirmPassword" required>
                </div>

                <button class="btn btn-jtech">Đổi mật khẩu</button>
                <a href="/tai-khoan" class="btn btn-secondary">Quay lại</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
