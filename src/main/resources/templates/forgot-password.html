<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>

    <link rel="icon" type="image/png" href="/images/logos/favicon.png?v=5">
    <link rel="shortcut icon" href="/images/logos/favicon.png?v=5">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-jtech">
    <div class="container">
        <a class="navbar-brand brand-logo-link" href="/">
            <span class="brand-logo-box">
                <img src="/images/logos/logochinh-removebg.png"
                     alt="J-Tech Store"
                     class="brand-logo-img">
            </span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Trang chủ</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/products">Sản phẩm</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/cart">Giỏ hàng</a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="/login">Đăng nhập</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/register">Đăng ký</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-header card-jtech-header">
            <h4 class="mb-0">Quên mật khẩu</h4>
        </div>

        <div class="card-body">
            <p class="text-muted">
                Nhập email đã đăng ký tài khoản. Hệ thống sẽ gửi mã xác nhận về email của bạn.
            </p>

            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

            <form method="post" action="/forgot-password">
                <div class="mb-3">
                    <label class="form-label">
                        Email tài khoản <span class="text-danger">*</span>
                    </label>

                    <input class="form-control"
                           type="email"
                           name="email"
                           placeholder="Ví dụ: tenkhach@gmail.com"
                           required>
                </div>

                <button class="btn btn-jtech">Gửi mã xác nhận</button>
                <a href="/login" class="btn btn-secondary">Quay lại đăng nhập</a>
            </form>
        </div>
    </div>

    <div class="alert alert-jtech mt-3">
        Mã xác nhận sẽ có hiệu lực trong 5 phút.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
